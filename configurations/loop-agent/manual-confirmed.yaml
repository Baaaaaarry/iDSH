fixed_system_patterns:
  status: FIXED_SYSTEM
  paths:
    - "*.type"
    - "*.system"
    - "*.children"
    - "*.eventq_index"
    - "*.in_port"
    - "*.out_port"
    - "*.request_port"
    - "*.response_port"
    - "*.addr_ranges"
    - "*.cluster_id"
    - "*.router_id"
    - "*.link_id"

guardrail_patterns:
  status: GUARDRAIL
  paths:
    - "*.deadlock_threshold"
    - "*.garnet_deadlock_threshold"
    - "*.enable_fault_model"
    - "*.network_fault_model"
    - "*.randomization"
    - "*.allow_zero_latency"

