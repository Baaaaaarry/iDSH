*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 Inter,ui-sans-serif,system-ui,sans-serif}button{font:inherit}header{height:68px;padding:0 28px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;background:#0b1220;position:sticky;top:0;z-index:10}.brand{display:flex;align-items:center;gap:12px}.brand-mark{width:34px;height:34px;border:1px solid #35507a;border-radius:7px;display:grid;place-items:center;color:var(--cyan)}.brand-mark svg,.stage-icon svg{fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}h1{font-size:17px;margin:0}.subtitle,.muted{color:var(--muted)}.subtitle{font-size:12px}.health{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:12px}.dot{width:8px;height:8px;border-radius:50%;background:var(--amber)}.health.ok .dot{background:var(--green);box-shadow:0 0 0 4px rgba(102,217,150,.08)}main{max-width:1680px;margin:auto;padding:22px 28px 40px}.toolbar{display:flex;align-items:flex-end;justify-content:space-between;gap:18px;margin-bottom:16px}.toolbar h2{font-size:18px;margin:0 0 4px}.refresh{color:var(--muted);font-size:12px}.metric-grid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px}.card{background:var(--panel);border:1px solid var(--line);border-radius:9px}.metric{padding:14px 16px;min-height:86px}.metric-label{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.04em}.metric-value{font-size:23px;font-weight:650;margin-top:4px;font-variant-numeric:tabular-nums}.metric-note{font-size:11px;color:var(--muted);margin-top:2px}.workflow{margin-top:14px;padding:16px 18px}.section-head{display:flex;justify-content:space-between;align-items:flex-start;gap:18px;margin-bottom:14px}.section-head h3{font-size:14px;margin:0}.stage-now{color:var(--cyan);font-weight:650}.journey{display:flex;align-items:flex-start;overflow:auto;padding:4px 0 2px}.journey-step{position:relative;flex amber{background:rgba(242,198,109,.12);color:var(--amber)}.progress-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:17px}.progress-label{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-bottom:6px}.progress{height:6px;border-radius:6px;background:#202b3e;overflow:hidden}.progress>span{display:block;height:100%;background:var(--cyan);border-radius:6px}.analysis-grid{display:grid;grid-template-columns:1.35fr .9fr;gap:14px}.chart-wrap{height:250px;position:relative}.chart-wrap svg{width:100%;height:100%;overflow:visible}.chart-axis{stroke:#334158}.chart-grid{stroke:#243047}.chart-label{fill:var(--muted);font-size:10px}.chart-line{fill:none;stroke:var(--cyan);stroke-width:2.2}.chart-area{fill:url(#areaFill)}.chart-dot{fill:var(--bg);stroke:var(--cyan);stroke-width:2}.chart-target{stroke:var(--amber);stroke-dasharray:5 4}.legend{display:flex;gap:16px;color:var(--muted);font-size:11px;margin-bottom:8px}.legend i{display:inline-block;width:14px;height:2px;margin:0 6px 3px 0;background:var(--cyan)}.legend i.target{background:var(--amber)}.phase-list{display:grid;gap:10px}.phase-row{display:grid;grid-template-columns:110px 1fr 45px;align-items:center;gap:10px;font-size:12px}.phase-track{height:6px;background:#202b3e;border-radius:4px;overflow:hidden}.phase-fill{height:100%;background:var(--blue)}.phase-row.active .phase-fill{background:var(--cyan)}.phase-row.active .phase-name{color:var(--cyan)}.split-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.table-wrap{overflow:auto;max-width:100%}table{width:100%;border-collapse:collapse;font-size:12px}th,td{padding:9px 8px;text-align:left;border-bottom:1px solid #202c41;vertical-align:top}th{position:sticky;top:0;background:var(--panel);color:var(--muted);font-weight:550;white-space:nowrap}td.num{text-align:right;font-variant-numeric:tabular-nums}code{font:11px/1.4 ui-monospace,SFMono-Regular,Menlo,monospace;color:#9bdcf3}.scope-tabs{display:flex;gap:6px;margin-bottom:12px}.scope-tab{border:1px solid var(--line);background:transparent;color:var(--muted);padding:6px 10px;border-radius:6px;cursor:pointer}.scope-tab.active{background:#1a2b42;border-color:#41658f;color:var(--text)}.config-list{max-height:270px;overflow:auto}.config-row{display:grid;grid-template-columns:minmax(130px,1fr) minmax(80px,.7fr);gap:10px;padding:7px 2px;border-bottom:1px solid #202c41}.config-row code:last-child{text-align:right;color:var(--text);word-break:break-all}.empty{padding:36px;text-align:center;color:var(--muted)}.status-running{color:var(--cyan)}.status-completed{color:var(--green)}.status-failed{color:var(--red)}
.live-run{margin-top:14px;padding:11px 12px;background:#131f30;border-left:3px solid var(--cyan)}.live-head{display:flex;justify-content:space-between;gap:12px;margin-bottom:7px}.live-detail{display:flex;flex-wrap:wrap;gap:8px 18px;color:var(--muted);font-size:11px}.change-list{margin-top:8px;display:flex;flex-wrap:wrap;gap:6px}.change{padding:3px 7px;border-radius:4px;background:#1a293d;color:#b9dff1;font:10px ui-monospace,monospace}

</style></head><body>
<header><div class="brand"><div class="brand-mark" id="brand-icon"></div><div><h1>D9300 Ruby Optimization</h1><div class="subtitle">Loop Agent 实验控制台</div></div></div><div id="health" class="health"><span class="dot"></span><span>正在连接</span></div></header>
<main><div class="toolbar"><div><h2>自动优化概览</h2><div class="muted">P-core、E-core 与共享 Ruby 子系统的搜索进展</div></div><div id="refreshed" class="refresh">等待数据</div></div><section id="metrics" class="metric-grid"></section><section class="card workflow"><div class="section-head"><div><h3>当前工作阶段</h3><div class="muted">从配置生成到收敛固化</div></div><div id="active-stage" class="stage-now">等待实验</div></div><div id="workflow" class="journey"></div></section><div class="body-grid"><aside class="card experiments"><div class="section-head"><h3>优化实验</h3><span id="experiment-count" class="badge">0</span></div><div id="experiments" class="experiment-list"></div></aside><section id="detail" class="detail"><div class="card empty">尚无可展示的实验</div></section></div></main>
<script>
const $=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num=(v,d=2)=>Number(v??0).toFixed(d),pct=(v,d=1)=>`${num(Number(v??0)*100,d)}%`,clamp=(v,a=0,b=100)=>Math.max(a,Math.min(b,v));
const icon=d=>`<svg viewBox="0 0 24 24" aria-hidden="true">${d}</svg>`;
const icons={chip:icon('<rect x="6" y="6" width="12" height="12" rx="2"/><path d="M9 9h6v6H9zM9 2v4m6-4v4M9 18v4m6-4v4M2 9h4m-4 6h4m12-6h4m-4 6h4"/>'),prepare:icon('<path d="M9 3h6m-5 0v5l-5 9a2 2 0 0 0 1.8 3h10.4a2 2 0 0 0 1.8-3l-5-9V3M8 14h8"/>'),baseline:icon('<path d="M4 19h16M6 16l4-5 3 2 5-7"/><circle cx="18" cy="6" r="1"/>'),config:icon('<path d="M4 7h10m4 0h2M4 17h2m4 0h10M14 4v6M6 14v6"/>'),validate:icon('<path d="M12 3l8 3v5c0 5-3.4 8.4-8 10-4.6-1.6-8-5-8-10V6l8-3Z"/><path d="m8.5 12 2.2 2.2 4.8-5"/>'),benchmark:icon('<path d="M4 19V9m6 10V5m6 14v-7m6 7V3M2 19h21"/>'),optimize:icon('<circle cx="12" cy="12" r="3"/><path d="M12 2v3m0 14v3M4.9 4.9 7 7m10 10 2.1 2.1M2 12h3m14 0h3M4.9 19.1 7 17M17 7l2.1-2.1"/>'),finish:icon('<circle cx="12" cy="12" r="9"/><path d="m8 12 2.7 2.7L16.5 9"/>')};$('brand-icon').innerHTML=icons.chip;
const stages=[['prepare','准备实验','初始化'],['baseline','基线测试','Classic / Ruby'],['config','生成配置','选择候选参数'],['validate','验证配置','约束与正确性'],['benchmark','性能测试','运行 GKB'],['optimize','模型更新','分析并迭代'],['finish','完成','固化配置']];
const stageMap={CREATE_EXPERIMENT:'prepare',RUN_BASELINE:'baseline',GENERATE_INITIAL_CANDIDATES:'config',GENERATE_NEXT_CANDIDATES:'config',CONSTRAINT_CHECK:'validate',RECORD_INVALID:'validate',CORRECTNESS_SMOKE:'validate',LEARN_FAILURE_REGION:'validate',GKB_QUICK_TEST:'benchmark',PARSE_METRICS:'benchmark',FULL_GKB_VALIDATION:'benchmark',STABILITY_REPEAT:'benchmark',UPDATE_OPTIMIZER:'optimize',CHECK_CONVERGENCE:'optimize',FINAL_VALIDATION_DECISION:'optimize',VARIANCE_CHECK:'optimize',FREEZE_CONFIG:'finish',GENERATE_SUMMARY:'finish',DASHBOARD_FINAL_RESULT:'finish'};
let selectedId=null,selectedScope='all',currentExperiment=null;
function statusClass(s=''){return s==='RUNNING'?'status-running':s.startsWith('COMPLETED')?'status-completed':/FAILED|STOPPED/.test(s)?'status-failed':''}
function renderWorkflow(raw){const active=stageMap[raw]||'prepare',idx=stages.findIndex(x=>x[0]===active);$('active-stage').textContent=stages[idx][1];$('workflow').innerHTML=stages.map((s,i)=>`<div class="journey-step ${i<idx?'done':''} ${i===idx?'active':''}"><div class="stage-icon">${icons[s[0]]}</div><div class="stage-name">${s[1]}</div><div class="stage-note">${i<idx?'已完成':i===idx?'正在进行':s[2]}</div></div>`).join('')}
function metric(label,value,note=''){return `<div class="card metric"><div class="metric-label">${esc(label)}</div><div class="metric-value">${esc(value)}</div><div class="metric-note">${esc(note)}</div></div>`}
function progress(label,value,max){const ratio=max?clamp(value/max*100):0;return `<div><div class="progress-label"><span>${esc(label)}</span><span>${value} / ${max}</span></div><div class="progress" role="progressbar" aria-valuenow="${ratio}" aria-valuemin="0" aria-valuemax="100"><span style="width:${ratio}%"></span></div></div>`}
function scopeOf(name=''){const n=name.toLowerCase();if(/^p_core[.\/]/.test(n)||/^pcore[._]/.test(n))return'p';if(/^e_core[.\/]/.test(n)||/^ecore[._]/.test(n))return'e';if(/^shared[.\/]/.test(n)||/(l3|hnf|snf|network|dram)/.test(n))return'shared';return'all'}
function flatten(obj,prefix='',out=[]){if(obj&&typeof obj==='object'&&!Array.isArray(obj)){for(const [k,v] of Object.entries(obj))flatten(v,prefix?`${prefix}.${k}`:k,out)}else out.push([prefix,obj]);return out}
function lineChart(data,baseline,target){if(!data.length)return'<div class="empty">等待迭代数据</div>';const w=720,h=220,p={l:52,r:20,t:16,b:34},vals=data.map(x=>x.best_score||baseline),all=[...vals,baseline,target].filter(Number.isFinite),min=Math.min(...all),max=Math.max(...all),pad=Math.max((max-min)*.14,1),lo=min-pad,hi=max+pad,x=i=>p.l+(data.length===1?0:(w-p.l-p.r)*i/(data.length-1)),y=v=>p.t+(h-p.t-p.b)*(hi-v)/(hi-lo),pts=vals.map((v,i)=>`${x(i)},${y(v)}`).join(' '),area=`${x(0)},${h-p.b} ${pts} ${x(data.length-1)},${h-p.b}`,ticks=[lo,(lo+hi)/2,hi];return `<svg viewBox="0 0 ${w} ${h}" role="img" aria-label="Best-so-far性能趋势"><defs><linearGradient id="areaFill" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4ed9d1" stop-opacity=".24"/><stop offset="1" stop-color="#4ed9d1" stop-opacity="0"/></linearGradient></defs>${ticks.map(t=>`<line class="chart-grid" x1="${p.l}" x2="${w-p.r}" y1="${y(t)}" y2="${y(t)}"/><text class="chart-label" x="${p.l-8}" y="${y(t)+3}" text-anchor="end">${num(t,0)}</text>`).join('')}<line class="chart-target" x1="${p.l}" x2="${w-p.r}" y1="${y(target)}" y2="${y(target)}"/><text class="chart-label" x="${w-p.r}" y="${y(target)-5}" text-anchor="end">目标 ${num(target,0)}</text><polygon class="chart-area" points="${area}"/><polyline class="chart-line" points="${pts}"/>${vals.map((v,i)=>`<circle class="chart-dot" cx="${x(i)}" cy="${y(v)}" r="3"><title>迭代 ${data[i].number+1}: ${num(v,2)}</title></circle>`).join('')}<line class="chart-axis" x1="${p.l}" x2="${w-p.r}" y1="${h-p.b}" y2="${h-p.b}"/><text class="chart-label" x="${p.l}" y="${h-10}">迭代 1</text><text class="chart-label" x="${w-p.r}" y="${h-10}" text-anchor="end">迭代 ${data.length}</text></svg>`}
function phaseRows(e){const active=stageMap[e.current_stage]||'prepare',idx=stages.findIndex(x=>x[0]===active);return stages.map((s,i)=>{const v=i<idx?100:i===idx?(e.state==='RUNNING'?55:100):0;return `<div class="phase-row ${i===idx?'active':''}"><span class="phase-name">${s[1]}</span><div class="phase-track"><div class="phase-fill" style="width:${v}%"></div></div><span class="num">${v}%</span></div>`}).join('')}
function parameterRows(e){const dims=e.spec.dimensions||e.spec.search_space||[];return dims.map(d=>{const allowed=d.values||[],tested=new Set(e.trials.map(t=>t.config?.[d.name]).filter(v=>v!==undefined).map(v=>JSON.stringify(v))),champ=e.champion?.config?.[d.name];return{name:d.name,scope:scopeOf(d.name),allowed:allowed.length,tested:tested.size,coverage:allowed.length?tested.size/allowed.length:0,champ}}).sort((a,b)=>b.coverage-a.coverage)}
function configRows(e,scope){const entries=flatten(e.champion?.config||{}),filtered=scope==='all'?entries:entries.filter(([k])=>scopeOf(k)===scope);return filtered.length?filtered.map(([k,v])=>`<div class="config-row"><code>${esc(k)}</code><code>${esc(typeof v==='object'?JSON.stringify(v):v)}</code></div>`).join(''):'<div class="empty">当前最优配置没有该核域的独立参数</div>'}
function trialStatus(t){if(t.status==='COMPLETED')return'<span class="status-completed">通过</span>';if(t.status==='RUNNING')return'<span class="status-running">运行中</span>';return`<span class="status-failed">${esc(t.status)}</span>`}
function renderLive(e){const t=e.current_trial;if(!t)return;const overview=document.querySelector('.overview');if(!overview)return;const detail=t.progress_detail||{},changes=(t.changed_parameters||[]).slice(0,8).map(p=>`<span class="change">${esc(p.path||p.name||'parameter')}: ${esc(p.old_value??'-')} → ${esc(p.new_value??'-')}</span>`).join('');overview.insertAdjacentHTML('beforeend',`<div class="live-run"><div class="live-head"><strong>正在执行 ${esc(t.id)}</strong><span class="status-running">${num((t.progress||0)*100,0)}%</span></div><div class="progress"><span style="width:${clamp((t.progress||0)*100)}%"></span></div><div class="live-detail"><span>阶段：${esc(t.stage||e.current_stage||'-')}</span><span>核域：${esc(t.core_scope||'-')}</span><span>测试：${esc(t.benchmark_kind||'-')}</span><span>当前项：${esc(detail.current_case||detail.current_test||detail.message||'-')}</span></div>${changes?`<div class="change-list">${changes}</div>`:''}</div>`)}
function renderDetail(e){currentExperiment=e;const trials=e.trials||[],iters=e.iterations||[],champ=e.champion,base=Number(e.spec.baseline_score||0),best=champ?.result?.score||base,gain=base?best/base-1:0,stop=e.spec.stop||{},running=trials.filter(t=>t.status==='RUNNING').length,passed=trials.filter(t=>t.status==='COMPLETED').length,failed=trials.length-passed-running,paramRows=parameterRows(e),coverage=paramRows.length?paramRows.reduce((s,p)=>s+p.coverage,0)/paramRows.length:0,target=base*(1+Number(stop.target_performance_improvement||0));
$('metrics').innerHTML=metric('当前实验',e.state==='RUNNING'?'运行中':e.state.startsWith('COMPLETED')?'已完成':'等待',e.name)+metric('当前迭代',iters.length,`上限 ${stop.max_iterations??'-'}`)+metric('已执行 Trial',trials.length,`${passed} 通过 · ${failed} 失败`)+metric('最优性能',num(best,2),`相对基线 ${pct(gain)}`)+metric('硬件 MAPE',champ?pct(champ.result.hardware_mape):'-',`目标 ≤ ${pct(stop.target_hardware_mape)}`)+metric('搜索覆盖',pct(coverage),`${paramRows.length} 个参数维度`);renderWorkflow(e.current_stage);
const recent=trials.slice().reverse().slice(0,16).map(t=>`<tr><td>${t.iteration+1}</td><td><code>${esc(t.id.split('-').slice(-1)[0])}</code></td><td>${trialStatus(t)}</td><td class="num">${t.result?num(t.result.score):'-'}</td><td class="num">${t.result?pct(t.result.hardware_mape):'-'}</td><td class="num">${t.result?pct(t.result.cv):'-'}</td><td class="num">${t.result?num(t.result.sim_seconds,0)+'s':'-'}</td></tr>`).join('');
const params=paramRows.map(p=>`<tr><td><code>${esc(p.name)}</code></td><td>${p.scope==='p'?'P-core':p.scope==='e'?'E-core':p.scope==='shared'?'Shared':'通用'}</td><td class="num">${p.tested} / ${p.allowed}</td><td><div class="progress"><span style="width:${clamp(p.coverage*100)}%"></span></div></td><td><code>${p.champ===undefined?'-':esc(p.champ)}</code></td></tr>`).join('');
$('detail').innerHTML=`<section class="card overview"><div class="title-row"><div><h2>${esc(e.name)}</h2><div class="muted">${esc(e.id)} · gem5 ${esc(e.spec.gem5_commit||'-')}</div></div><span class="badge ${e.state==='RUNNING'?'amber':e.state.startsWith('COMPLETED')?'green':'red'}">${esc(e.state)}</span></div><div class="progress-grid">${progress('Trial预算',trials.length,stop.max_trials||0)}${progress('迭代预算',iters.length,stop.max_iterations||0)}</div>${e.stop_reason?`<div class="muted" style="margin-top:12px">停止原因：${esc(e.stop_reason)}</div>`:''}</section><div class="analysis-grid"><section class="card panel"><div class="section-head"><h3>阶段性最优性能</h3><span class="badge">Best-so-far</span></div><div class="legend"><span><i></i>最优得分</span><span><i class="target"></i>目标得分</span></div><div class="chart-wrap">${lineChart(iters,base,target)}</div></section><section class="card panel"><div class="section-head"><h3>阶段进度</h3><span class="muted">${esc(e.current_stage||'-')}</span></div><div class="phase-list">${phaseRows(e)}</div></section></div><div class="split-grid"><section class="card panel"><div class="section-head"><h3>参数遍历覆盖</h3><span class="muted">候选值探索情况</span></div><div class="table-wrap"><table><thead><tr><th>参数</th><th>核域</th><th>已测 / 候选</th><th>覆盖率</th><th>当前最优</th></tr></thead><tbody>${params||'<tr><td colspan="5" class="empty">没有搜索维度</td></tr>'}</tbody></table></div></section><section class="card panel"><div class="section-head"><h3>当前最优 Ruby 配置</h3><span class="muted">按核域查看</span></div><div class="scope-tabs">${[['all','全部'],['p','P-core'],['e','E-core'],['shared','Shared']].map(([id,label])=>`<button class="scope-tab ${selectedScope===id?'active':''}" onclick="setScope('${id}')">${label}</button>`).join('')}</div><div class="config-list">${configRows(e,selectedScope)}</div></section></div><section class="card panel"><div class="section-head"><h3>最近 Trial</h3><span class="muted">每 5 秒自动刷新</span></div><div class="table-wrap"><table><thead><tr><th>迭代</th><th>Trial</th><th>状态</th><th>得分</th><th>硬件 MAPE</th><th>CV</th><th>仿真耗时</th></tr></thead><tbody>${recent||'<tr><td colspan="7" class="empty">尚未开始测试</td></tr>'}</tbody></table></div></section>`}
function setScope(scope){selectedScope=scope;if(currentExperiment){renderDetail(currentExperiment);renderLive(currentExperiment)}}
async function selectExperiment(id){selectedId=id;document.querySelectorAll('.experiment-btn').forEach(b=>b.classList.toggle('selected',b.dataset.id===id));try{const r=await fetch(`/api/experiments/${encodeURIComponent(id)}`,{cache:'no-store'});if(!r.ok)throw Error();const e=await r.json();renderDetail(e);renderLive(e)}catch{$('detail').innerHTML='<div class="card empty status-failed">实验数据读取失败</div>'}}
async function load(){try{const r=await fetch('/api/experiments',{cache:'no-store'});if(!r.ok)throw Error();const exps=await r.json();$('health').classList.add('ok');$('health').lastElementChild.textContent='服务正常';$('refreshed').textContent=`更新于 ${new Date().toLocaleTimeString('zh-CN',{hour12:false})}`;$('experiment-count').textContent=exps.length;$('experiments').innerHTML=exps.length?exps.map(e=>`<button class="experiment-btn ${e.id===selectedId?'selected':''}" data-id="${esc(e.id)}" onclick="selectExperiment('${esc(e.id)}')"><strong>${esc(e.name)}</strong><div class="experiment-meta"><span class="${statusClass(e.state)}">${esc(e.state)}</span><span>${new Date(e.updated_at).toLocaleString('zh-CN',{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'})}</span></div></button>`).join(''):'<div class="empty">尚无实验</div>';if(exps.length){if(!selectedId||!exps.some(e=>e.id===selectedId))selectedId=exps[0].id;await selectExperiment(selectedId)}else{$('metrics').innerHTML=metric('实验总数',0,'等待 Loop Agent 创建实验');renderWorkflow('CREATE_EXPERIMENT')}}catch{$('health').classList.remove('ok');$('health').lastElementChild.textContent='服务不可用'}}
load();setInterval(load,5000);
</script></body></html>
