[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gem5-lab"
version = "0.1.0"
description = "Non-invasive, agent-ready closed-loop Ruby configuration optimizer for gem5"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.110", "uvicorn>=0.27"]

[project.scripts]
gem5-lab = "gem5_lab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]

